name: Android Debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Prepare debug APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk elder-home-helper-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          path: elder-home-helper-debug.apk
          archive: false
          if-no-files-found: error

      - name: Upload debug APK to Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f debug-latest "$GITHUB_SHA"
          git push origin debug-latest --force
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release edit debug-latest --title "Latest Debug APK" --notes "Latest debug APK built from main."
            gh release upload debug-latest elder-home-helper-debug.apk --clobber
          else
            gh release create debug-latest elder-home-helper-debug.apk --title "Latest Debug APK" --notes "Latest debug APK built from main."
          fi
